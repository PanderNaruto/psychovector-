<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — PsychoVector</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        .login-container { max-width: 450px; margin: 80px auto; padding: 0 20px; }
        .login-card { background: var(--white); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); }
        .login-card h2 { color: var(--dark-green); margin-bottom: 8px; text-align: center; }
        .login-card .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-dark); margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--lighter-green); outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--medium-green); background: var(--white); }
        .btn-submit { width: 100%; padding: 14px; background: var(--dark-green); color: var(--white); border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn-submit:hover { background: var(--medium-green); }
        .login-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .login-footer a { color: var(--dark-green); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
        .required::after { content: ' *'; color: #c62828; font-weight: 700; font-size: 14px; }
        
        /* Кнопка темы в правом верхнем углу */
        .theme-toggle-top {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- Кнопка переключения темы -->
    <div class="theme-toggle-top">
        <button id="theme-toggle-btn" onclick="toggleTheme()" title="Переключить тему">🌙 Тёмная</button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h2>Вход в PsychoVector</h2>
            <p class="subtitle">Введите данные для входа в систему</p>
            <div class="form-group">
                <label for="login-email" class="required">Электронная почта</label>
                <input type="email" id="login-email" placeholder="example@mail.ru" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="login-password" class="required">Пароль</label>
                <input type="password" id="login-password" placeholder="Введите пароль" autocomplete="current-password" required>
            </div>
            <button class="btn-submit" onclick="handleLogin()">Войти</button>
            <div class="login-footer">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
            <div class="login-footer" style="margin-top: 12px;">
                <a href="guide.html" style="color: var(--medium-green); font-weight: 600;">📖 Руководство</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-email').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('login-password').focus(); });
        document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
