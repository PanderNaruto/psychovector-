<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Созданные тестирования — PsychoVector</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .my-tests-container { max-width: 1200px; margin: 32px auto; padding: 0 40px; }
        .tests-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
        .stats-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); text-align: center; }
        .stats-card .stat-value { font-size: 32px; font-weight: 700; color: var(--dark-green); }
        .stats-card .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
        .test-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .test-card-info { flex: 1; min-width: 0; }
        .test-card-title { font-size: 18px; font-weight: 600; color: var(--text-dark); margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .test-card-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .test-card-desc { font-size: 14px; color: var(--text-dark); line-height: 1.5; }
        .test-card-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .test-card-stats { text-align: right; flex-shrink: 0; min-width: 120px; }
        .test-card-stats .participants { font-size: 24px; font-weight: 700; color: var(--dark-green); }
        .test-card-stats .participants-label { font-size: 12px; color: var(--text-muted); }
        .btn-action { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: 13px; transition: all 0.2s; font-family: inherit; }
        .btn-action:hover { border-color: var(--dark-green); color: var(--dark-green); }
        .btn-action.danger { color: #c62828; border-color: #ef9a9a; background: #ffebee; }
        .btn-action.danger:hover { background: #ffcdd2; }
        .btn-action.primary { background: var(--dark-green); color: var(--white); border-color: var(--dark-green); }
        .btn-action.primary:hover { background: var(--medium-green); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); }
        .empty-state h3 { color: var(--text-dark); margin-bottom: 12px; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
        .filter-bar input { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--white); min-width: 250px; }
        .filter-bar select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--white); }
    </style>
</head>
<body>
    <div style="padding:16px 40px;font-size:14px;color:var(--text-muted);">Личный кабинет психолога</div>

    <nav class="nav-bar">
        <div class="logo">PsychoVector</div>
        <div class="nav-links">
            <a href="dashboard.html">Личный кабинет</a>
            <a href="create-test.html">Создать тестирование</a>
            <a href="my-tests.html" class="active">Созданные тестирования</a>
            <a href="results.html">Результаты</a>
        </div>
        <button id="theme-toggle-btn" onclick="toggleTheme()" title="Переключить тему">🌙 Тёмная</button>
        <button class="nav-logout" onclick="handleLogout()">Выйти</button>
    </nav>

    <div class="dashboard-header">
        <h1>Созданные тестирования</h1>
    </div>

    <div class="my-tests-container">
        <div class="tests-stats">
            <div class="stats-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Всего тестов</div>
            </div>
            <div class="stats-card">
                <div class="stat-value" id="stat-active">0</div>
                <div class="stat-label">Активных</div>
            </div>
            <div class="stats-card">
                <div class="stat-value" id="stat-participants">0</div>
                <div class="stat-label">Всего участников</div>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="🔍 Поиск по названию..." oninput="renderTests()">
            <select id="status-filter" onchange="renderTests()">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="draft">Черновики</option>
            </select>
        </div>

        <div id="tests-list"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let myTests = [];

        document.addEventListener('DOMContentLoaded', async function() {
            const user = requirePsychologist();
            if (!user) return;
            await loadMyTests(user);
        });

        async function loadMyTests(user) {
            const tests = await Storage.getTests();
            myTests = tests.filter(t => t.createdBy === user.id);

            document.getElementById('stat-total').textContent = myTests.length;
            document.getElementById('stat-active').textContent = myTests.filter(t => t.status === 'active').length;
            document.getElementById('stat-participants').textContent = myTests.reduce((sum, t) => sum + (t.participants || 0), 0);

            renderTests();
        }

        function renderTests() {
            const container = document.getElementById('tests-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            let filtered = myTests;

            if (search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search));
            if (statusFilter !== 'all') filtered = filtered.filter(t => t.status === statusFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Тестирований пока нет</h3>
                        <p>Создайте первое тестирование, чтобы начать работу</p>
                        <button class="btn-primary" onclick="window.location.href='create-test.html'" style="margin-top:20px;">+ Создать тестирование</button>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(t => {
                const isVRR = t.methodData && t.methodData.type === 'vrr';
                const testPage = isVRR ? 'take-vrr-test.html' : 'take-test.html';
                const testUrl = window.location.origin + '/' + testPage + '?id=' + t.id;
                
                const vrrBadge = isVRR 
                    ? '<span style="display:inline-block;padding:2px 8px;background:var(--light-green);color:var(--dark-green);border-radius:4px;font-size:11px;font-weight:600;">ВРР</span>' 
                    : '';

                const statusClass = t.status === 'active' ? 'status-active' : 'status-draft';
                const statusText = t.status === 'active' ? 'Активно' : 'Черновик';
                const date = new Date(t.createdAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                const questionsCount = t.questions ? t.questions.length : 0;

                // Экранируем кавычки в ID на всякий случай
                const safeId = String(t.id).replace(/'/g, "\\'");

                return `
                    <div class="test-card">
                        <div class="test-card-info">
                            <div class="test-card-title">${t.title} ${vrrBadge}</div>
                            <div class="test-card-meta">
                                ${date} · ${questionsCount} вопр. · <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="test-card-desc">${t.description || 'Без описания'}</div>
                            <div style="margin-top:8px;font-size:12px;color:var(--text-muted);">
                                Ссылка: <a href="${testUrl}" target="_blank" style="color:var(--medium-green);word-break:break-all;">${testUrl}</a>
                            </div>
                        </div>
                        <div class="test-card-stats">
                            <div class="participants">${t.participants || 0}</div>
                            <div class="participants-label">участников</div>
                        </div>
                        <div class="test-card-actions">
                            <button class="btn-action primary" onclick="copyLink('${safeId}', '${testPage}')" title="Копировать ссылку">🔗</button>
                            <button class="btn-action" onclick="toggleStatus('${safeId}')" title="Сменить статус">${t.status === 'active' ? '⏸' : '▶'}</button>
                            <button class="btn-action danger" onclick="deleteTest('${safeId}')" title="Удалить">🗑</button>
                        </div>
                    </div>`;
            }).join('');
        }

        // ===== НАДЕЖНАЯ ФУНКЦИЯ КОПИРОВАНИЯ =====
        function copyLink(testId, testPage) {
            const origin = window.location.origin === 'null' ? '' : window.location.origin;
            const url = origin + '/' + testPage + '?id=' + testId;
            
            // Попытка 1: современный API (работает в HTTPS и localhost)
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(() => {
                    showNotification('Ссылка скопирована в буфер обмена!', 'success');
                }).catch(() => {
                    fallbackCopy(url);
                });
            } else {
                // Попытка 2: запасной вариант для HTTP или file://
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification('Ссылка скопирована в буфер обмена!', 'success');
                } else {
                    showNotification('Не удалось скопировать. Скопируйте ссылку вручную из карточки.', 'error');
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showNotification('Не удалось скопировать. Скопируйте ссылку вручную из карточки.', 'error');
            }
            
            document.body.removeChild(textArea);
        }
        // ==========================================

        async function toggleStatus(testId) {
            const test = myTests.find(t => t.id === testId);
            if (!test) return;

            const newStatus = test.status === 'active' ? 'draft' : 'active';
            const tests = await Storage.getTests();
            const idx = tests.findIndex(t => t.id === testId);
            if (idx !== -1) {
                tests[idx].status = newStatus;
                await Storage.saveTests(tests);
                myTests = tests.filter(t => t.createdBy === test.createdBy);
                showNotification(newStatus === 'active' ? 'Тест активирован' : 'Тест переведён в черновики', 'success');
                renderTests();
            }
        }

        async function deleteTest(testId) {
            const test = myTests.find(t => t.id === testId);
            if (!test) return;

            if (!confirm(`Удалить тест "${test.title}"?\n\nЭто действие нельзя отменить. Также будут удалены все результаты участников.`)) return;

            const tests = await Storage.getTests();
            const newTests = tests.filter(t => t.id !== testId);
            await Storage.saveTests(newTests);

            const results = await Storage.getResults();
            const newResults = results.filter(r => r.testId !== testId);
            await Storage.saveResults(newResults);

            myTests = newTests.filter(t => t.createdBy === test.createdBy);
            showNotification('Тест удалён', 'success');
            renderTests();
        }
    </script>
</body>
</html>
