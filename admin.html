<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — PsychoVector</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <style>
        .admin-container { max-width: 1200px; margin: 32px auto; padding: 0 40px; }
        .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); text-align: center; }
        .stat-card .stat-value { font-size: 32px; font-weight: 700; color: var(--dark-green); }
        .stat-card .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
        .users-table-card { background: var(--white); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
        .users-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .users-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
        .users-table td { padding: 16px 12px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
        .users-table tr:hover td { background: var(--lighter-green); }
        .role-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .role-admin { background: #ffebee; color: #c62828; }
        .role-psychologist { background: var(--light-green); color: var(--dark-green); }
        .role-user { background: #e3f2fd; color: #1565c0; }
        .btn-action { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: 13px; transition: all 0.2s; font-family: inherit; margin-right: 6px; }
        .btn-action.danger { color: #c62828; border-color: #ef9a9a; background: #ffebee; }
        .btn-action.danger:hover { background: #ffcdd2; }
        .btn-action.primary { background: var(--dark-green); color: var(--white); border-color: var(--dark-green); }
        .btn-action.primary:hover { background: var(--medium-green); }
        .password-code { background: #f8f9fa; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #c62828; font-weight: 600; border: 1px solid #e9ecef; }
    </style>
</head>
<body>
    <div style="padding:16px 40px;font-size:14px;color:var(--text-muted);">Админ-панель</div>

    <nav class="nav-bar">
        <div class="logo">PsychoVector</div>
        <div class="nav-links">
            <a href="dashboard.html">Личный кабинет</a>
            <a href="admin.html" class="active">Админ-панель</a>
        </div>
        <button id="theme-toggle-btn" onclick="toggleTheme()" title="Переключить тему">🌙 Тёмная</button>
        <button class="nav-logout" onclick="handleLogout()">Выйти</button>
    </nav>

    <div class="admin-container">
        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-total-users">0</div>
                <div class="stat-label">Всего пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-psychologists">0</div>
                <div class="stat-label">Психологов</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-regular-users">0</div>
                <div class="stat-label">Обычных пользователей</div>
            </div>
        </div>

        <div class="users-table-card">
            <h3 style="margin-bottom: 8px;">Управление пользователями</h3>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom: 20px;">Просмотр, управление и сброс паролей пользователей системы.</p>
            
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Пользователь</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Пароль</th>
                        <th>Действия</th>
                    </tr>
                    <tr>
                        <th colspan="5" style="padding: 0;">
                            <input type="text" id="search-input" placeholder="🔍 Поиск по имени, логину или email..." 
                                   style="width:100%; padding:12px; border:none; border-top:1px solid var(--border); outline:none; font-size:14px;" 
                                   oninput="renderUsers()">
                        </th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allUsers = [];
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async function() {
            currentUser = requireAuth();
            if (!currentUser || currentUser.role !== 'admin') {
                showNotification('Доступ запрещен. Требуются права администратора.', 'error');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                return;
            }
            await loadUsers();
        });

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                allUsers = await response.json();
                updateStats();
                renderUsers();
            } catch (error) {
                showNotification('Ошибка загрузки пользователей', 'error');
            }
        }

        function updateStats() {
            document.getElementById('stat-total-users').textContent = allUsers.length;
            document.getElementById('stat-psychologists').textContent = allUsers.filter(u => u.role === 'psychologist').length;
            document.getElementById('stat-regular-users').textContent = allUsers.filter(u => u.role === 'user').length;
        }

        function renderUsers() {
            const tbody = document.getElementById('users-tbody');
            const search = document.getElementById('search-input').value.toLowerCase();

            const filtered = allUsers.filter(u => 
                (u.fullName && u.fullName.toLowerCase().includes(search)) ||
                (u.login && u.login.toLowerCase().includes(search)) ||
                (u.email && u.email.toLowerCase().includes(search))
            );

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">Пользователи не найдены</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(u => {
                const isMe = u.id === currentUser.id;
                const roleClass = `role-${u.role}`;
                const roleName = u.role === 'admin' ? 'Администратор' : u.role === 'psychologist' ? 'Психолог' : 'Пользователь';
                // Показываем пароль, если он есть, иначе заглушку
                const passwordDisplay = u.password ? u.password : '••••••••';

                return `
                    <tr>
                        <td>
                            <div style="font-weight:600; color:var(--text-dark);">${u.fullName || 'Не указано'}</div>
                            <div style="font-size:12px; color:var(--text-muted);">@${u.login || 'нет логина'}</div>
                        </td>
                        <td>${u.email}</td>
                        <td><span class="role-badge ${roleClass}">${roleName}</span></td>
                        <td>
                            <span class="password-code">${passwordDisplay}</span>
                        </td>
                        <td>
                            ${!isMe ? `
                                <button class="btn-action primary" onclick="resetPassword('${u.id}', '${u.login || u.email}')" title="Сменить пароль">🔑 Сменить пароль</button>
                                <button class="btn-action danger" onclick="deleteUser('${u.id}')" title="Удалить пользователя">🗑 Удалить</button>
                            ` : '<span style="color:var(--text-muted); font-size:13px;">Это вы</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function resetPassword(userId, userName) {
            const newPassword = prompt(`Введите новый пароль для пользователя "${userName}"\n(Минимум 6 символов):`);
            
            if (newPassword === null) return; // Нажата отмена
            
            if (!newPassword || newPassword.trim().length < 3) {
                showNotification('Пароль должен содержать минимум 3 символа', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        newPassword: newPassword.trim()
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification(`Пароль изменен! Новый пароль: "${data.newPassword}"`, 'success');
                    await loadUsers(); // Перезагружаем таблицу, чтобы обновить отображение пароля
                } else {
                    showNotification(data.error || 'Ошибка при смене пароля', 'error');
                }
            } catch (error) {
                showNotification('Ошибка соединения с сервером', 'error');
            }
        }

        async function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            if (!confirm(`Вы уверены, что хотите удалить пользователя "${user.fullName || user.email}"?\n\nЭто действие нельзя отменить. Все созданные им тесты и результаты будут удалены.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('Пользователь успешно удален', 'success');
                    await loadUsers();
                } else {
                    showNotification(data.error || 'Ошибка удаления', 'error');
                }
            } catch (error) {
                showNotification('Ошибка соединения с сервером', 'error');
            }
        }
    </script>
</body>
</html>
